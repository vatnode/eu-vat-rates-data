name: Update EU VAT Rates

on:
  schedule:
    # Every day at 07:00 UTC (08:00 Brussels winter / 09:00 summer)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show diff without committing)'
        type: boolean
        default: false

jobs:
  update:
    name: Fetch & commit updated rates
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Preserve previous snapshot for release notes
        run: cp data/eu-vat-rates-data.json /tmp/eu-vat-rates-data.previous.json

      - name: Fetch latest VAT rates
        id: fetch
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 scripts/update.py --dry-run
          else
            python3 scripts/update.py
          fi

      - name: Update standard rate history
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 scripts/update_history.py --dry-run
          else
            python3 scripts/update_history.py
          fi

      - name: Validate generated datasets
        run: |
          python3 scripts/validate_data.py
          python3 -m unittest discover tests

      - name: Prepare meaningful release notes
        id: release
        if: steps.fetch.outputs.rates_changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          python3 scripts/release_notes.py \
            /tmp/eu-vat-rates-data.previous.json \
            data/eu-vat-rates-data.json \
            /tmp/release-notes.md

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "vatnode-bot"
          git config user.email "bot@vatnode.dev"
          git add data/eu-vat-rates-data.json
          # history-pre-tedb.json is deliberately absent: the booklet extract is
          # frozen and must never be rewritten by CI.
          git add data/history-tedb.json data/eu-vat-rates-history.json
          git diff --staged --quiet || git commit -m "chore: update VAT rates ${DATE}"
          git push

      - name: Create release for actual rate changes
        if: steps.fetch.outputs.rates_changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --target main \
            --title "${{ steps.release.outputs.title }}" \
            --notes-file /tmp/release-notes.md
